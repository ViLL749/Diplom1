{% extends "base.html" %}
{% block title %}Удалить заказ{% endblock %}
{% block content %}
    <h1>Удалить заказ</h1>
    <p>Вы уверены, что хотите удалить заказ {{ order }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{{ cancel_url }}" class="btn">Отмена</a>
    </form>
{% endblock %}
