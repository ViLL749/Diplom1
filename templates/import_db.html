<!-- templates/import_db.html -->
{% extends "base.html" %}
{% block title %}Импорт базы данных{% endblock %}
{% block content %}
    <h1>Импорт базы данных</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div>
            <label for="db_file">Выберите JSON-файл:</label>
            <input type="file" name="db_file" id="db_file" accept=".json" required>
        </div>
        <div class="mrg-top search-container">
            <button type="submit" class="btn">Импортировать</button>
            <a href="{{ cancel_url }}" class="btn btn-danger">Отмена</a>
        </div>
    </form>
{% endblock %}
