{% extends "base.html" %}
{% block title %}Редактировать производителя{% endblock %}
{% block content %}
<h1>Редактировать производителя</h1>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div>
        <label for="{{ field.id_for_label }}">{{ field.label }}:</label>
        {{ field }}
        {% if field.errors %}<p class="error">{{ field.errors|join:", " }}</p>{% endif %}
    </div>
    {% endfor %}
    <button type="submit" class="btn">Сохранить</button>
    <a href="{% url 'brands_list' %}" class="btn btn-danger">Отмена</a>
</form>
{% endblock %}
