{% extends "base.html" %}
{% block title %}Удалить поставщика{% endblock %}
{% block content %}
<h1>Удалить поставщика?</h1>
<p>Вы уверены, что хотите удалить поставщика <strong>{{ supplier.name }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'suppliers_list' %}" class="btn">Отмена</a>
</form>
{% endblock %}
