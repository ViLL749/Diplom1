<!-- Модальное окно выбора заказ-наряда -->
<div id="workorder-modal" class="modal" style="display:none;">
    <div class="modal-content">
        <span class="modal-close" onclick="closeWorkOrderModal()">×</span>
        <h2>Выбор заказ-наряда</h2>
        <div class="search-container">
            <input type="text" id="wo-modal-search" placeholder="Поиск по №, клиенту или авто...">
            <button type="button" class="btn" onclick="searchWorkOrders()">Искать</button>
        </div>
        <div class="overflow-table">
            <table>
                <thead><tr><th>№</th><th>Клиент</th><th>Автомобиль</th><th>Статус</th></tr></thead>
                <tbody id="wo-modal-list"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
var _woHiddenId  = null;
var _woDisplayId = null;

function openWorkOrderModal(hiddenId, displayId) {
    _woHiddenId  = hiddenId;
    _woDisplayId = displayId;
    document.getElementById('wo-modal-search').value = '';
    searchWorkOrders();
    document.getElementById('workorder-modal').style.display = 'block';
}

function closeWorkOrderModal() {
    document.getElementById('workorder-modal').style.display = 'none';
}

function searchWorkOrders() {
    var q = document.getElementById('wo-modal-search').value;
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '{% url "api_work_orders" %}?search=' + encodeURIComponent(q));
    xhr.onload = function() {
        if (xhr.status === 200) {
            var data = JSON.parse(xhr.responseText);
            var tbody = document.getElementById('wo-modal-list');
            tbody.innerHTML = '';
            data.orders.forEach(function(o) {
                var tr = document.createElement('tr');
                tr.className = 'wo-row';
                tr.style.cursor = 'pointer';
                tr.innerHTML = '<td>#' + o.id + '</td><td>' + o.client + '</td><td>' + o.car + '</td><td>' + o.status + '</td>';
                tr.addEventListener('click', function() {
                    document.getElementById(_woHiddenId).value = o.id;
                    document.getElementById(_woDisplayId).value = '#' + o.id + ' — ' + o.client + ' (' + o.car + ')';
                    closeWorkOrderModal();
                });
                tbody.appendChild(tr);
            });
            if (data.orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="color:#888;">Заказ-наряды не найдены.</td></tr>';
            }
        }
    };
    xhr.send();
}

document.getElementById('wo-modal-search').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); searchWorkOrders(); }
});

window.addEventListener('click', function(e) {
    if (e.target === document.getElementById('workorder-modal')) closeWorkOrderModal();
});
</script>
