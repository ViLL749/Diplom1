{% extends "base.html" %}
{% block title %}Удалить марку автомобиля{% endblock %}
{% block content %}
    <h1>Вы уверены, что хотите удалить марку "{{ object }}"?</h1>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{{ cancel_url }}" class="btn">Отмена</a>
    </form>
{% endblock %}
