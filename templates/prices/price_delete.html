{% extends "base.html" %}
{% block title %}Удалить цену на услугу{% endblock %}
{% block content %}
    <h1>Вы уверены, что хотите удалить цену на услугу для "{{ object.car_model.name }}" ({{ object.service.name }} — {{ object.price }} руб.)?</h1>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{{ cancel_url }}" class="btn">Отмена</a>
    </form>
{% endblock %}
